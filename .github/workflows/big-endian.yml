# Guards the portable v4 codecs against host-endian regressions. The on-disk
# format is always little-endian. Rust literal wire vectors run under Miri's
# s390x emulation; native OS, mmap, locking, and durability behavior belongs to
# the native platform matrix. Go runs its existing full suite under qemu-s390x.
name: Big-endian

on:
  push:
    branches: [master]
    paths:
      - 'v4/rust/**'
      - 'v4/go/**'
      - 'v4/conformance/**'
      - '.github/workflows/big-endian.yml'
  pull_request:
    branches: [master]
    paths:
      - 'v4/rust/**'
      - 'v4/go/**'
      - 'v4/conformance/**'
      - '.github/workflows/big-endian.yml'
  workflow_dispatch:

permissions: {}

jobs:
  big-endian:
    name: s390x portable codec parity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install qemu-user-static (s390x emulation)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Install Rust nightly + Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          rustup default nightly

      - name: Rust — portable codec vectors under Miri (s390x)
        working-directory: v4/rust
        run: |
          cargo miri test --target s390x-unknown-linux-gnu \
            -p iprange-livedb --no-default-features --lib big_endian_portable_

      - name: Go — full suite under qemu-s390x (big-endian)
        working-directory: v4/go
        env:
          CGO_ENABLED: '0'
          GOARCH: s390x
          GOOS: linux
        run: |
          go test -exec qemu-s390x-static -count=1 ./...
