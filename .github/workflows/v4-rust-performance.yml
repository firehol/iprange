name: Rust v4 performance disaster gate

on:
  push:
    branches: [master]
    paths:
      - 'v4/rust/**'
      - '.github/workflows/v4-rust-performance.yml'
  pull_request:
    branches: [master]
    paths:
      - 'v4/rust/**'
      - '.github/workflows/v4-rust-performance.yml'
  workflow_dispatch:

permissions: {}

jobs:
  representative-workloads:
    name: Representative update-ipsets workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the benchmark worker
        run: |
          cargo build --manifest-path v4/rust/Cargo.toml \
            --profile bench -p iprange-livedb --bin iprange-v4-worker

      - name: Run the loose performance gate
        run: |
          cargo bench --manifest-path v4/rust/Cargo.toml \
            -p iprange-livedb --bench update_ipsets -- ci
